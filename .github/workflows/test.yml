name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go cache
        id: go-cache
        uses: ./.github/actions/go-cache

      - name: Set up Node.js and TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install Task
        uses: ./.github/actions/setup-task

      - name: Build gavel
        run: task build:prod

      # Node + TypeScript for the jest/vitest/playwright test frameworks and
      # the tsc lint check live in these UI projects' devDependencies.
      - name: Install test runner dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: testrunner/ui

      - name: Install PR UI dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: pr/ui

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      # `gavel test` compiles all Go test binaries in a pre-build phase before
      # the timed per-package run, so a cold build cache no longer eats into the
      # per-package deadline. Disable with --pre-build=false.
      - name: Run tests
        run: ./.bin/gavel test
        env:
          GAVEL_DB_EMBEDDED_TEST: "1"

      # The Test job is the only writer of the Go cache: it compiles every
      # test binary on top of the gavel build, so its copy is a superset of
      # what Lint or the action self-test would save. always() keeps a failing
      # test run from throwing that compile work away, and saving only from
      # the default branch keeps one copy per go.sum instead of one per PR
      # (PR-branch caches are invisible to other branches anyway). An exact
      # hit means the key already exists and cannot be replaced, so skip it.
      - name: Save Go cache
        if: >-
          always()
          && github.ref_name == github.event.repository.default_branch
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.paths }}
          key: ${{ steps.go-cache.outputs.key }}

  gavel-npm:
    name: "@flanksource/gavel library"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testrunner/ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build:lib
