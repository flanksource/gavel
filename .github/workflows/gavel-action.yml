name: Gavel Action (self-test)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  self-test:
    name: gavel test + lint via composite action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: ./.github/actions/setup-task

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Install golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          version=v2.11.4
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/${version}/golangci-lint-${version#v}-linux-amd64.tar.gz" -o "$tmp/golangci-lint.tar.gz"
          tar -xzf "$tmp/golangci-lint.tar.gz" -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/golangci-lint-${version#v}-linux-amd64/golangci-lint" "$HOME/.local/bin/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/golangci-lint" version

      - name: Build gavel from source
        run: |
          task build:prod
          install_dir="$HOME/.local/bin"
          mkdir -p "$install_dir"
          cp .bin/gavel "$install_dir/gavel"
          echo "$install_dir" >> "$GITHUB_PATH"

      # Tests and linters are separate phases on purpose. Run as `test --lint`
      # they share one exit code and one results file, so a lint violation fails
      # the job with a red X that says nothing about whether the tests passed —
      # and the reverse hides every lint finding behind the first failing test.
      # Split, each phase reports its own artifact and sticky comment, and the
      # job's failure names which one broke.
      - name: Run gavel tests
        uses: ./
        with:
          args: test --timeout 20m --test-timeout 10m
          timeout-minutes: "30"
          version: source
          comment-header: gavel-self-test
          fail-on-error: "true"

      # always(): the lint phase is not downstream of the tests, so a failing
      # test must not cost this run its lint results. Both signals land on every
      # run, which is what makes one push enough to see all the work left.
      - name: Run gavel linters
        if: always()
        uses: ./
        with:
          args: lint --timeout 10m
          timeout-minutes: "15"
          version: source
          json-file: gavel-lint-results.json
          html-file: gavel-lint-results.html
          artifact-name: gavel-lint-results
          comment-header: gavel-self-test-lint
          fail-on-error: "true"
