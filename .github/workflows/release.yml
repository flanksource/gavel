name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: ./.github/actions/setup-task

      - name: Build embedded UI bundles
        run: |
          task test-ui
          task pr-ui

      - uses: flanksource/deps@v1.0.46
        with:
          tools: |
            svu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag must carry the embedded UI bundles (testui.js / prui.js /
      # prui.css): without them a downstream `go get` by tag fails with
      # `//go:embed dist/...`: "no matching files found". The bundles are
      # committed on a release-only commit and only the tag is pushed, because
      # main's ruleset requires status checks and rejects a direct bot push.
      # That commit is never on main, so svu must count tags on every branch.
      - id: tag
        run: |
          next=$(svu patch --tag.mode all --tag.pattern 'v*')
          current=$(svu current --tag.mode all --tag.pattern 'v*')
          if [ "$next" = "$current" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new version to tag (current: $current)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f testrunner/ui/dist/testui.js pr/ui/dist/prui.js pr/ui/dist/prui.css
          if ! git diff --cached --quiet; then
            git commit -m "chore(embed): rebuild UI bundles for $next"
          fi
          git tag "$next"
          git push origin "refs/tags/$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest    }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go cache
        uses: ./.github/actions/go-cache

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: ./.github/actions/setup-task

      - name: Build binary
        run: task build:cross GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GO_TAGS=gavel_menubar

      - name: Archive binary
        id: archive
        run: |
          mkdir -p dist
          archive_name="gavel_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp ".bin/${archive_name}" dist/gavel
          tar -czf "dist/${archive_name}.tar.gz" -C dist gavel
          echo "path=dist/${archive_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  # gavel is the CLI and hosted serve image, built from the release binary; gavel-runner is the
  # image sandbox jobs run in, built from source by sandbox/runner.Dockerfile for amd64 only, the
  # architecture hosted clusters run.
  build-docker:
    name: Build ${{ matrix.image }} ${{ matrix.platform }}
    needs: [tag, build-binaries]
    if: needs.tag.outputs.created == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gavel,        dockerfile: Dockerfile,                platform: linux/amd64, runner: ubuntu-latest,    goarch: amd64, pair: linux-amd64 }
          - { image: gavel,        dockerfile: Dockerfile,                platform: linux/arm64, runner: ubuntu-24.04-arm, goarch: arm64, pair: linux-arm64 }
          - { image: gavel-runner, dockerfile: sandbox/runner.Dockerfile, platform: linux/amd64, runner: ubuntu-latest,    goarch: amd64, pair: linux-amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Download linux binary
        if: matrix.image == 'gavel'
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-${{ matrix.goarch }}
          path: .

      - name: Extract binary
        if: matrix.image == 'gavel'
        run: |
          tar -xzf "gavel_linux_${{ matrix.goarch }}.tar.gz"
          chmod +x gavel
          ls -l gavel

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    name: Merge ${{ matrix.image }} multi-arch manifest
    needs: [tag, build-docker]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [gavel, gavel-runner]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # word-splitting is required to pass -t tags and digest refs as separate args
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.tag.outputs.tag }}"

  # Packages chart/ at the release's version, with the release's images: gavel by tag and the
  # sandbox runner by digest, since substrate runs images only by digest.
  helm:
    name: Package Helm chart
    needs: [tag, merge-docker]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Set chart versions and runner image
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/gavel-runner:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          export VERSION="${TAG#v}" APP_VERSION="$TAG" RUNNER="${{ env.REGISTRY }}/gavel-runner@$digest"
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(APP_VERSION)' chart/Chart.yaml
          yq -i '.sandbox.image = strenv(RUNNER)' chart/values.yaml

      - name: Package chart
        run: helm package chart

      - name: Upload helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: gavel-*.tgz
          if-no-files-found: error

  push-helm-chart:
    needs: [tag, helm]
    if: needs.tag.outputs.created == 'true'
    permissions:
      actions: read
      contents: read
    uses: flanksource/action-workflows/.github/workflows/push-helm-chart.yml@5d7f5f3616936fd703e58c5ee7e4527dc9f6adcc # main
    with:
      filename_regex: "gavel-*.tgz"
      version: ${{ needs.tag.outputs.tag }}
      pr_title: "Release ${{ needs.tag.outputs.tag }} of ${{ github.repository }}"
    secrets:
      token: ${{ secrets.FLANKBOT }}

  release:
    name: Create GitHub release
    needs: [tag, build-binaries]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum gavel_*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Gavel $TAG" \
            --generate-notes \
            dist/gavel_*.tar.gz dist/checksums.txt
