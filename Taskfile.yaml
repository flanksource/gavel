version: "3"

vars:
  BINARY_NAME: .bin/gavel
  MAIN_PACKAGE: ./cmd/gavel

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  clicky-ui:build:
    run: once
    desc: |
      Rebuild the local @flanksource/clicky-ui sibling when it is checked out
      next to gavel, so its dist/ reflects local edits before a UI bundle links
      against it. A no-op in CI (and anywhere without the sibling), where
      clicky-ui is resolved from the npm registry instead. Builds via --filter
      from the workspace so it reuses the deps pnpm already installed.
    sources:
      - ../clicky-ui/packages/ui/src/**/*
      - ../clicky-ui/packages/ui/package.json
      - ../clicky-ui/packages/ui/vite.config.ts
    generates:
      - ../clicky-ui/packages/ui/dist/index.js
    cmds:
      - cmd: |
          if [ -d ../clicky-ui/packages/ui ]; then
            echo "Rebuilding local @flanksource/clicky-ui sibling..."
            (cd ../clicky-ui && corepack pnpm --filter @flanksource/clicky-ui run build)
          else
            echo "No local clicky-ui sibling; using published @flanksource/clicky-ui from npm"
          fi

  ui-install:
    run: once
    desc: |
      Install UI deps serially. Both pr/ui and testrunner/ui link the sibling
      clicky-ui as a workspace package, so each install writes into the SHARED
      ../clicky-ui/packages/ui/node_modules. Running the two installs in parallel
      (as build's deps did) races on those symlinks -> "EEXIST ... jsdom".
      Serial installs avoid the race; the vite builds that follow only read
      clicky-ui/dist, so they can still run in parallel.
    deps:
      - clicky-ui:build
    cmds:
      - cd testrunner/ui && CI=true corepack pnpm install --no-frozen-lockfile
      - cd pr/ui && CI=true corepack pnpm install --no-frozen-lockfile
    sources:
      - testrunner/ui/package.json
      - testrunner/ui/pnpm-lock.yaml
      - pr/ui/package.json
      - pr/ui/pnpm-lock.yaml
    generates:
      - testrunner/ui/node_modules/.modules.yaml
      - pr/ui/node_modules/.modules.yaml

  test-ui:
    desc: Build the test UI frontend bundle (Preact + Vite)
    dir: testrunner/ui
    deps:
      - ui-install
    cmds:
      - corepack pnpm run build
    sources:
      - testrunner/ui/src/**/*
      - testrunner/ui/package.json
      - testrunner/ui/pnpm-workspace.yaml
      - testrunner/ui/pnpm-lock.yaml
      - testrunner/ui/vite.config.ts
    generates:
      - testrunner/ui/dist/testui.js

  gavel-lib:
    desc: |
      Build the @flanksource/gavel React library (dist/lib). pr/ui imports it as
      @flanksource/gavel/testrunner to render test/lint results, and the package's
      exports map points at dist/lib — so this must exist before pr-ui bundles.
    dir: testrunner/ui
    deps:
      - ui-install
    cmds:
      - corepack pnpm run build:lib
    sources:
      - testrunner/ui/src/**/*
      - testrunner/ui/package.json
      - testrunner/ui/vite.lib.config.ts
    generates:
      - testrunner/ui/dist/lib/testrunner.js

  pr-ui:
    desc: Build the PR review UI frontend bundle (React + Vite)
    dir: pr/ui
    deps:
      - ui-install
      - gavel-lib
    cmds:
      - corepack pnpm run build
    sources:
      - pr/ui/src/**/*
      - pr/ui/package.json
      - pr/ui/pnpm-workspace.yaml
      - pr/ui/pnpm-lock.yaml
      - pr/ui/vite.config.ts
    generates:
      - pr/ui/dist/prui.js

  ui:publish:
    desc: |
      Publish the @flanksource/gavel React library to npm (manual initial publish).
      Uses the version already in testrunner/ui/package.json — it does NOT bump;
      the release workflow auto patch-bumps subsequent publishes. Requires NPM_TOKEN.
    dir: testrunner/ui
    vars:
      VERSION:
        sh: node -p "require('./package.json').version"
    preconditions:
      - sh: test -n "$NPM_TOKEN"
        msg: "NPM_TOKEN must be set to publish (export NPM_TOKEN=...)"
      - sh: 'test -z "$(npm view @flanksource/gavel@{{.VERSION}} version 2>/dev/null)"'
        msg: "@flanksource/gavel@{{.VERSION}} is already published; bump testrunner/ui/package.json first"
    env:
      NODE_AUTH_TOKEN: "$NPM_TOKEN"
    cmds:
      - CI=true corepack pnpm install --no-frozen-lockfile
      - corepack pnpm run check
      - corepack pnpm test
      - corepack pnpm run build:lib
      # Publish via the npm CLI (not pnpm): the package keeps a published
      # clicky-ui range — no workspace: protocol to rewrite — and npm is the
      # proven path for OIDC/provenance. No --provenance here: it requires a CI
      # OIDC provider (the release workflow supplies that). Manual local publishes omit it.
      - npm publish --access public

  build:
    desc: Build the binary
    deps:
      - test-ui
      - pr-ui
    vars:
      VERSION:
        sh: git describe --tags --always 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      DATE:
        sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
      GO_TAGS: '{{.GO_TAGS | default ""}}'
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
    cmds:
      - |
        tags="{{.GO_TAGS}}"
        if [ -n "$tags" ]; then
          go build -tags "$tags" -ldflags "{{.LDFLAGS}}" -o {{.BINARY_NAME}} {{.MAIN_PACKAGE}}
        else
          go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY_NAME}} {{.MAIN_PACKAGE}}
        fi
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      # Both UIs are //go:embed-ed, so a frontend-only change still changes the
      # binary. Without them here Task calls the build up to date after the
      # bundles are rebuilt, and `make build` silently ships the previous UI —
      # which looks exactly like the fix not working.
      - ./pr/ui/dist/**
      - ./testrunner/ui/dist/**
    generates:
      - ./{{.BINARY_NAME}}

  build:prod:
    desc: Build the production binary with optional native integrations
    deps:
      - pr-ui
    vars:
      VERSION:
        sh: git describe --tags --always 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      DATE:
        sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
      GO_TAGS: gavel_menubar
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
    cmds:
      - go build -tags "{{.GO_TAGS}}" -ldflags "{{.LDFLAGS}}" -o {{.BINARY_NAME}} {{.MAIN_PACKAGE}}

  build:cross:
    desc: |
      Cross-compile the binary for a given GOOS/GOARCH.
      Pass the target via CLI vars: `task build:cross GOOS=darwin GOARCH=arm64`.
      Defaults to linux/amd64. Output: {{.BINARY_NAME}}_<goos>_<goarch>.
    deps:
      - test-ui
      - pr-ui
    vars:
      GOOS: '{{.GOOS | default "linux"}}'
      GOARCH: '{{.GOARCH | default "amd64"}}'
      GO_TAGS: '{{.GO_TAGS | default ""}}'
      VERSION:
        sh: git describe --tags --always 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      DATE:
        sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
      OUTPUT: "{{.BINARY_NAME}}_{{.GOOS}}_{{.GOARCH}}"
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
      CGO_ENABLED: 0
    cmds:
      - mkdir -p .bin
      - |
        tags="{{.GO_TAGS}}"
        if [ -n "$tags" ]; then
          go build -tags "$tags" -trimpath -ldflags "{{.LDFLAGS}}" -o {{.OUTPUT}} {{.MAIN_PACKAGE}}
        else
          go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.OUTPUT}} {{.MAIN_PACKAGE}}
        fi
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - ./{{.OUTPUT}}

  install:
    desc: Install the binary to $GOPATH/bin
    cmds:
      - mv "{{.BINARY_NAME}}" "$GOPATH/bin/"

  deploy:
    desc: |
      Cross-compile gavel for linux-amd64 and install it on a remote host.
      Pass the target as a positional arg: `task deploy -- user@host`.
      Reinstalls the systemd unit via `gavel ssh install --force`, which
      reloads and restarts the service.
    deps:
      - task: build:cross
        vars: { GOOS: linux, GOARCH: amd64 }
    vars:
      BINARY_LOCAL: "{{.BINARY_NAME}}_linux_amd64"
      TARGET: "{{.CLI_ARGS}}"
    preconditions:
      - sh: test -n "{{.TARGET}}"
        msg: "usage: task deploy -- user@host"
    cmds:
      - scp {{.BINARY_LOCAL}} {{.TARGET}}:gavel
      - ssh -t {{.TARGET}} 'sudo install -m 0755 -o root -g root ~/gavel /usr/local/bin/gavel && sudo /usr/local/bin/gavel ssh install --force && rm -f ~/gavel'

  test:
    desc: Run tests
    deps:
      - build
    cmds:
      - go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v '/hack/' | grep -v '/vendor/')
    env:
      # arch-unit is a member of this workspace and requires cgo for its
      # treesitter plugin, so it builds with CGO_ENABLED=1. Testing here with 0
      # compiled the entire shared graph a second time.
      CGO_ENABLED: 1

  test:unit:
    desc: Run unit tests only
    cmds:
      - go test -v -short $(go list ./... | grep -v '/hack/' | grep -v '/vendor/')

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v '/hack/' | grep -v '/vendor/')
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"
    env:
      # Matches task test; see the note there.
      CGO_ENABLED: 1

  lint:
    desc: Run linters
    cmds:
      - cmd: golangci-lint run
        ignore_error: true
      - go vet ./...
      - go mod tidy

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...
      - gofmt -s -w .

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -f coverage.out coverage.html
      - rm -rf dist/
      - go clean -cache

  mod:
    desc: Download and tidy modules
    cmds:
      - go mod download
      - go mod tidy

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -t gavel:latest .

  docker:run:
    desc: Run Docker container
    deps: [docker:build]
    cmds:
      - docker run --rm gavel:latest --help

  ci:
    desc: Run CI pipeline locally
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build:prod
