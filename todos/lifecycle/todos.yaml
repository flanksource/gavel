# The built-in todo lifecycle. Each step is a captain prompt reference plus the
# CEL predicates that decide when it applies (`when`, over subject/runs/last)
# and which status its result lands the todo in (`outcomes`, ordered, first
# true wins, none → error).
#
# Every step returns the same envelope, {success, event, comment}: `events` is
# the vocabulary of its event, and the outcomes read `envelope.success` and
# `envelope.event`. A step changes TODOs through the tool sets it declares
# (`tools`), which write when they are called.
#
# Steps are listed in the order Next considers them. Verification comes before
# implementation so a todo whose last run landed without being checked is
# verified rather than re-implemented.
name: todos
subject:
  id: string
  status: string
  priority: string
  labels: list<string>
  body: string
  attempts: int
  execution: map<string,dyn>   # { state }
  plan: map<string,dyn>        # { exists, approved, content, path, revision }
  verification: map<string,dyn> # { exists, document } — acceptance criteria are part of the document; their verdicts arrive in verify.checklist
steps:
  - name: triage
    prompt: todos.triage
    events: [ready, shape, investigate, done, retired, merged, duplicate]
    tools: [todos]
    auxiliary: true
    spec:
      permissions:
        mode: plan
    outcomes:
      - { status: failed, when: "run.state == 'failed' || !envelope.success" }
      - { status: keep, when: "true" } # the tools wrote what triage decided; status is untouched unless todo_update set one

  - name: plan
    prompt: todos.plan
    events: [new, updated, unchanged]
    tools: [todos, ask]
    when: "subject.status in ['draft', 'pending', 'failed', 'unverified'] && !subject.plan.exists"
    inputs:
      existingPlan: subject.plan.content
    outcomes:
      - { status: failed, when: "run.state != 'succeeded' || !envelope.success" }
      - { status: review, when: "envelope.event in ['new', 'updated']" }
      - { status: pending, when: "envelope.event == 'unchanged'" }

  - name: verify
    prompt: todos.verify # verify-only: the step runs the definition of done, not an agent turn
    events: [passed, failed]
    # Applies when the last implementation landed and no verification has judged it since.
    when: >-
      subject.verification.exists && subject.status in ['pending', 'unverified']
      && has(last.run) && last.run.state == 'succeeded'
      && (!has(last.verify) || (has(last.verify.finished_at) && has(last.run.finished_at) && last.verify.finished_at < last.run.finished_at))
    spec:
      workflow:
        verify:
          fixture: "{{subject.verification.document}}"
          scope: all
    outcomes:
      - { status: verified, when: "verify.ran && verify.passed" }
      - { status: unverified, when: "verify.ran && !verify.passed" }
      - { status: failed, when: "true" } # the verifier never ran: a scheduling failure, not a verdict

  - name: run
    prompt: todos.run
    events: [completed, blocked]
    tools: [todos, ask, pr]
    # A verified or completed todo is finished: it is reopened by a person, not
    # re-implemented because a backlog pass reached it.
    when: "subject.status in ['pending', 'failed', 'unverified'] && (!subject.plan.exists || subject.plan.approved)"
    inputs:
      existingPlan: subject.plan.content
    spec:
      setup:
        checkout:
          mode: local
          worktree:
            mode: new
      workflow:
        verify:
          fixture: "{{subject.verification.document}}"
          scope: changed
          maxIterations: 3
        commits:
          - on: run
            stage: worktree
            gates: full
    outcomes:
      # The definition of done is the verdict, ahead of the agent's own claim.
      - { status: pending, when: "run.state == 'cancelled'" }
      - { status: failed, when: "run.state == 'failed'" }
      - { status: verified, when: "verify.ran && verify.passed" }
      - { status: unverified, when: "verify.ran && !verify.passed" }
      - { status: failed, when: "!envelope.success" }
      - { status: pending, when: "true" }

  - name: triage.new
    prompt: todos.triage.new
    events: [kept, duplicate, merged, child]
    tools: [todos]
    auxiliary: true
    outcomes:
      - { status: failed, when: "run.state == 'failed' || !envelope.success" }
      - { status: keep, when: "true" }
