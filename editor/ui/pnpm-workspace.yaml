# Install published Clicky UI and page-runtime, and facet's pkg.pr.new build of main 964fab1,
# which has the browser-preview export the editor imports; Vite resolves the sibling checkouts
# in dev mode.
packages:
  - "."
allowBuilds:
  "@flanksource/clicky-ui": true
  "@parcel/watcher": true
  esbuild: true
  puppeteer: false
catalog:
  "@babel/core": ^7.29.0
  "@babel/preset-typescript": ^7.28.5
  "@types/babel__core": ^7.20.5
  "babel-preset-solid": ^1.9.12
  "solid-js": ^1.9.12
  "@flanksource/facet": https://pkg.pr.new/flanksource/facet/@flanksource/facet@964fab1
  # Published tarballs, as pr/ui installs clicky-ui: CI has no sibling checkouts.
  '@flanksource/clicky-ui': 0.3.74
  '@flanksource/page-runtime': 0.1.3
  "@mdx-js/mdx": ^3.1.1
  "@tailwindcss/node": ^4.3.3
  "@tailwindcss/oxide": ^4.3.3
  "es-module-lexer": ^3.0.0
  "fake-indexeddb": ^6.0.1
  "rehype-raw": ^7.0.0
  "remark-frontmatter": ^5.0.0
  "remark-gfm": ^4.0.0
  "remark-github-blockquote-alert": ^2.1.0
  "rolldown": ~1.2.14
  "sucrase": ^3.35.1
  "tsx": ^4.7.0
  "@ai-sdk/react": ^3.0.201
  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/commands": ^6.10.4
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lang-sql": ^6.10.0
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.0
  "@codemirror/view": ^6.43.4
  "@flanksource/icons": 1.0.65
  "@floating-ui/react": ^0.27.19
  '@iconify-icons/codicon': ^1.2.30
  '@iconify-icons/vscode-icons': ^1.2.29
  # Build-time only, mirrored from clicky-ui: its icon codegen renders
  # icon-data API responses to SVG.
  '@iconify/types': ^2.0.0
  '@iconify/utils': ^3.1.3
  '@joplin/turndown': ^4.0.85
  '@joplin/turndown-plugin-gfm': ^1.0.67
  '@lexical/react': 0.35.0
  '@medv/finder': ^4.0.2
  '@mdxeditor/editor': ^4.0.4
  "@monaco-editor/react": ^4.7.0
  "@oxlint/plugins": ^1.60.0
  "@playwright/test": ^1.64.0
  "@preact/preset-vite": ^2.9.3
  "@radix-ui/react-accordion": ^1.2.2
  "@radix-ui/react-avatar": ^1.1.2
  "@radix-ui/react-collapsible": ^1.1.2
  "@radix-ui/react-compose-refs": ^1.1.2
  "@radix-ui/react-dialog": ^1.1.4
  "@radix-ui/react-dropdown-menu": ^2.1.4
  "@radix-ui/react-menubar": ^1.1.4
  "@radix-ui/react-progress": ^1.1.1
  "@radix-ui/react-separator": ^1.1.1
  "@radix-ui/react-slot": ^1.1.1
  "@radix-ui/react-tabs": ^1.1.2
  "@radix-ui/react-tooltip": ^1.1.6
  "@shikijs/langs": ^1.24.0
  "@shikijs/themes": ^1.24.0
  "@shikijs/transformers": ^1.24.0
  "@storybook/addon-essentials": ^8.6.18
  "@storybook/react": ^8.6.18
  "@storybook/react-vite": 10.6.3
  "@storybook/addon-vitest": 10.6.3
  "@storybook/test": ^8.6.18
  "@tailwindcss/forms": ^0.5.9
  "@tanstack/react-query": ^5.101.1
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/react": ^16.1.0
  "@types/node": ^24
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1
  '@types/turndown': ^5.0.6
  ai: ^6.0.199
  ajv: ^8.18.0
  autoprefixer: ^10.4.20
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cmdk: ^1.0.4
  country-flag-icons: ^1.6.20
  dom-accessibility-api: ^0.6.3
  dompurify: ^3.4.11
  jotai: ^2.20.1
  jsonc-parser: 3.3.1
  jsdom: ^26.0.0
  marked: ^15.0.0
  lexical: 0.35.0
  modern-screenshot: ^4.7.0
  monaco-editor: 0.48.0
  monaco-yaml: 5.1.1
  oxlint: ^1.71.0
  postcss: ^8.4.49
  preact: ^10.25.3
  prettier: ^3.8.3
  react: ^18.3.1
  react-dom: ^18.3.1
  shiki: ^1.24.0
  sonner: ^1.7.1
  storybook: 10.6.3
  streamdown: ^2.5.0
  strip-ansi: ^7.2.0
  svgo: ^4.1.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^5.7.2
  tsdown: ^0.23.5
  bippy: 0.6.1
  vite: ^8.3.5
  vite-plugin-dts: ^4.5.4
  vitest: ^5.0.5
  yaml: ^2.8.3
  '@clerk/react': 6.17.3
  '@tailwindcss/vite': ^4.3.3
  '@vitejs/plugin-react': ^6.1.2
catalogMode: prefer

linkWorkspacePackages: true
preferWorkspacePackages: true
# Link through the global virtual store, like pr/ui and testrunner/ui.
enableGlobalVirtualStore: true

minimumReleaseAgeExclude:
  - '@flanksource/clicky-ui'
  - '@flanksource/facet'
  - '@flanksource/page-runtime'

# Keep shared peer types on React 19; the test-runner workspace uses React 18.
overrides:
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  brace-expansion: ^5.0.6
  fast-uri: ^3.1.2
  ws: ^8.21.0

packageExtensions:
  country-flag-icons:
    peerDependencies:
      react: "*"
    peerDependenciesMeta:
      react:
        optional: true
