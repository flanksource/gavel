# @flanksource/clicky-ui always installs from the registry. Local clicky-ui
# edits are picked up at the bundler level instead: vite.clicky.ts aliases the
# package to the sibling checkout's source for `vite serve` and `vite build`, and that source
# resolves its deps from clicky-ui's own install. The sibling is deliberately
# not a workspace package here — that made this lockfile a second owner of
# clicky-ui/packages/ui/node_modules and left two resolutions of its deps.
packages:
  - "."

enableGlobalVirtualStore: true
catalogMode: prefer

catalog:
  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/commands": ^6.10.4
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lang-sql": ^6.10.0
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.0
  "@codemirror/view": ^6.43.4
  "@ai-sdk/react": ^3.0.201
  "@floating-ui/react": ^0.27.19
  # Build-time only, mirrored from clicky-ui: its icon codegen renders
  # icon-data API responses to SVG.
  "@iconify/types": ^2.0.0
  "@iconify/utils": ^3.1.3
  "@mdxeditor/editor": ^4.0.4
  "@monaco-editor/react": ^4.7.0
  "@oxlint/plugins": ^1.60.0
  "@playwright/test": ^1.49.1
  "@preact/preset-vite": ^2.9.3
  "@radix-ui/react-accordion": ^1.2.2
  "@radix-ui/react-avatar": ^1.1.2
  "@radix-ui/react-collapsible": ^1.1.2
  "@radix-ui/react-compose-refs": ^1.1.2
  "@radix-ui/react-dialog": ^1.1.4
  "@radix-ui/react-dropdown-menu": ^2.1.4
  "@radix-ui/react-menubar": ^1.1.4
  "@radix-ui/react-progress": ^1.1.1
  "@radix-ui/react-separator": ^1.1.1
  "@radix-ui/react-slot": ^1.1.1
  "@radix-ui/react-tabs": ^1.1.2
  "@radix-ui/react-tooltip": ^1.1.6
  "@shikijs/langs": ^1.24.0
  "@shikijs/themes": ^1.24.0
  "@shikijs/transformers": ^1.24.0
  "@storybook/addon-essentials": ^8.6.18
  "@storybook/addon-vitest": 10.6.3
  "@storybook/react": 10.6.3
  "@storybook/react-vite": 10.6.3
  "@storybook/test": ^8.6.18
  "@tailwindcss/forms": ^0.5.9
  "@tanstack/react-query": ^5.66.8
  "@testing-library/jest-dom": ^6.6.3
  "@testing-library/react": ^16.1.0
  "@types/node": ^24
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1
  ai: ^6.0.199
  ajv: ^8.18.0
  autoprefixer: ^10.4.20
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  cmdk: ^1.0.4
  country-flag-icons: ^1.6.20
  dompurify: ^3.4.7
  jotai: ^2.20.1
  jsonc-parser: 3.3.1
  jsdom: ^26.0.0
  marked: ^15.0.0
  monaco-editor: 0.48.0
  monaco-yaml: 5.1.1
  oxlint: ^1.60.0
  postcss: ^8.4.49
  preact: ^10.25.3
  prettier: ^3.8.3
  react: ^18.3.1
  react-dom: ^18.3.1
  shiki: ^1.24.0
  sonner: ^1.7.1
  storybook: 10.6.3
  tailwind-merge: ^2.6.0
  tailwindcss: ^4.3.3
