# The todo lifecycle end to end, driven by the real `claude` CLI against
# captain's scripted Anthropic mock, watched from the todo's Session tab:
#
#   create (auto triage.new: title + labels) → plan → approve → run → verify
#
# Every step goes through a hermetic gavel dashboard on its own embedded
# Postgres and a throwaway git workspace. A background Playwright watcher keeps
# the Session tab open for the whole run and fails the fixture at teardown on
# any "Session error" alert, console error, page error or /api/ response >= 400.
#
#   gavel fixtures pr/ui/testdata/todo-lifecycle/claude.fixture.yaml
kind: Fixture
name: todo lifecycle (claude cli, aimock)
defaults:
  wait: { interval: 1s, backoff: { factor: 1.5, max: 5s }, jitter: 20%, timeout: 2m }
  timeout: 6m
steps:
  # `gavel serve` opens the dashboard with open/xdg-open; the fixture drives its
  # own browser, so both are shadowed with no-ops for every later step.
  - id: shims
    kind: exec
    script: |
      mkdir -p {{.tmp}}/bin {{.tmp}}/home
      for name in open xdg-open; do printf '#!/bin/sh\nexit 0\n' > {{.tmp}}/bin/$name; chmod +x {{.tmp}}/bin/$name; done
    export:
      PATH: "{{.tmp}}/bin:{{.env.PATH}}"
      FAKE_HOME: "{{.tmp}}/home"
    override: true

  - id: stack
    kind: services
    timeout: 8m
    services:
      postgres:
        deps: postgres
      aimock:
        # The journal outlives the fixture's tmp dir (repo .tmp/ is gitignored):
        # it is the first thing to read when a step misses a scripted reply.
        exec: captain ai mock --only anthropic --addr 127.0.0.1:{{.port}} --scenario {{.fixture.dir}}/claude.aimock.yaml --journal {{.fixture.dir}}/../../../../.tmp/todo-lifecycle-claude.aimock.jsonl
        ready: { tcp: "127.0.0.1:{{.port}}" }
      workspace:
        git:
          commit: true
          files:
            go.mod: |
              module example.com/acme

              go 1.24
            # gavel repos ignore their .tmp scratch dir. Without it the run's
            # commit gates leave .tmp/betterleaks-report.json in the run worktree,
            # which then counts as uncommitted and the verify step refuses it.
            .gitignore: |
              .tmp/
            greet/greet_test.go: |
              package greet

              import "testing"

              func TestGreeting(t *testing.T) {
              	if got := Greeting("x"); got != "hello x" {
              		t.Fatalf("Greeting(x) = %q, want %q", got, "hello x")
              	}
              }
            # triage.new gives the agent caller tools (todo_search, todo_update, todo_labels…),
            # which only captain's agent mode can expose; it still drives the
            # real claude binary, through the Agent SDK protocol.
            # ai.model is the base runtime for prompts outside the lifecycle steps,
            # e.g. the commit message the run step's commit:run hook generates.
            .gavel.yaml: |
              ai: { model: "cli:sonnet" }
              todos:
                triageNew: { model: "agent:sonnet" }
                plan: { model: "cli:sonnet" }
                run: { model: "cli:sonnet" }
        export:
          WORKSPACE: "{{.outputs.dir}}"
      gavel:
        # Builds the dashboard from this checkout and serves its UI through Vite
        # (--dev), which resolves @flanksource/clicky-ui from the sibling
        # checkout: the run tests the source under review, never a stale
        # embedded bundle or whatever gavel is installed.
        exec: go run ./cmd/gavel serve --dev --addr 127.0.0.1 --port {{.port}} acme/todo-lifecycle
        cwd: "{{.fixture.dir}}/../../../.."
        env:
          GAVEL_DB_DSN: "{{.services.postgres.url}}"
          HOME: $FAKE_HOME
          ANTHROPIC_BASE_URL: "{{.services.aimock.url}}"
          ANTHROPIC_API_KEY: captain-mock
          ANTHROPIC_AUTH_TOKEN: captain-mock
        # The page shell answers once Vite is up behind the Go server.
        ready: { http: "http://127.0.0.1:{{.port}}/todos", status: 200 }
        wait: { timeout: 5m }
        # default export: GAVEL_URL

  # The dashboard serves todos only for registered projects; register the
  # seeded workspace the way the UI does (into the fake HOME's projects.json).
  - id: project
    kind: exec
    script: |
      curl -fsS -X POST "$GAVEL_URL/api/projects" -H 'Content-Type: application/json' \
        -d "{\"name\":\"acme\",\"dir\":\"$WORKSPACE\",\"repos\":[]}"
    cel: json.dir == env.WORKSPACE

  - id: chrome
    kind: browser
    profile: {}
    # default exports: BROWSER_CDP_URL, BROWSER_WS_URL, BROWSER_SESSION, BROWSER_PROFILE_DIR

  - id: todo
    kind: todo
    dir: $WORKSPACE
    create:
      # A rough title, as the New todo dialog requires; triage.new renames it.
      title: greeting thing
      step: triage.new
      body: |
        add a greeting helper

        ## Verification

        ```bash
        go test ./greet/...
        ```
    # Proceed as soon as the todo exists, so the watcher is on the page for triage.
    wait: { until: "id != ''" }
    # default exports: TODO_ID, TODO_URL

  - id: watch
    kind: playwright
    background: true
    file: ../../e2e/watch-session.ts
    url: $TODO_URL?tab=session

  - id: triaged
    kind: todo
    get: true
    dir: $WORKSPACE
    # The rename lands through todo_update while the run is going; wait for it
    # and for the run itself to complete.
    wait:
      until: "run.state == 'completed' && todo.title != 'greeting thing'"
      failWhen: "run.state in ['failed', 'cancelled']"
      timeout: 90s
    cel: todo.title == 'Add Greeting helper to greet package' && 'api' in todo.labels

  - id: triaged-ui
    kind: agent-browser
    commands: ["open $TODO_URL?tab=session"]
    observe: snapshot
    wait: { until: "snapshot.contains('Add Greeting helper to greet package')", timeout: 30s }

  - id: plan
    kind: todo_prompt
    step: plan
    dir: $WORKSPACE
    wait:
      until: "todo.status == 'review'"
      failWhen: "todo.status in ['failed', 'ask'] || size(session.errors) > 0"
      timeout: 3m
    cel: plan.content.contains('greet/greet.go')

  - id: approve
    kind: todo
    approve: true
    dir: $WORKSPACE
    wait: { until: "todo.status == 'pending'", timeout: 20s }

  - id: run
    kind: todo_prompt
    step: run
    dir: $WORKSPACE
    retry: { attempts: 2, when: "launch.failed && launch.status == 409", delay: 2s, jitter: 25% }
    wait:
      until: "todo.status in ['verified', 'unverified']"
      failWhen: "todo.status in ['failed', 'ask'] || size(session.errors) > 0"
      timeout: 5m
    cel: todo.status == 'verified'

  # The run already verified its own change (scope: changed); this re-checks the
  # whole definition of done (scope: all) against the run's commit.
  - id: verify
    kind: todo_prompt
    step: verify
    force: true
    dir: $WORKSPACE
    wait: { until: "verify.ran", timeout: 3m }
    cel: verify.passed

  - id: session-ui
    kind: playwright
    script: |
      import { test, expect } from '../fixtures/cdp'

      test('session tab lists every attempt without session errors', async ({ page }) => {
        // Below the md breakpoint /todos/<id> renders the list, not the detail.
        await page.setViewportSize({ width: 1440, height: 900 })
        await page.goto(`${process.env.TODO_URL}?tab=session`)
        await expect(page.getByRole('heading', { name: /Add Greeting helper to greet package/ })).toBeVisible()
        // triage.new, plan, run and verify each recorded an attempt.
        await expect(page.getByTitle('4 attempts')).toBeVisible()
        await expect(page.getByRole('alert').filter({ hasText: /session errors?/i })).toHaveCount(0)
      })
