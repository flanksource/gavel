linkWorkspacePackages: true

# Force a single @types/react major across the workspace. The linked clicky-ui
# sibling pins React 18 while pr/ui (this app) is React 19; without a single
# @types/react, shared peer-typed libs (@mdxeditor/editor, recharts, radix) resolve
# React 19's ReactNode (with bigint) against clicky-ui's React 18 ReactNode → TS2786
# when clicky-ui's .d.ts are generated during a local `make build`. Dedupe the *type*
# packages to 19 (runtime react stays per-package); clicky-ui peerDeps allow React 19.
overrides:
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
# Prefer the linked local clicky-ui even when the registry has a newer matching
# version, so local edits always win. When the sibling is absent (CI) there is
# no workspace package and clicky-ui resolves from the registry.
preferWorkspacePackages: true
