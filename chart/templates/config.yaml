{{- /*
The server's ~/.gavel.yaml, whose storage section says where blobs go, with each setting rendered
as a template, and its properties file.
*/ -}}
{{- if not .Values.storage.existingSecret }}
{{- $s := .Values.storage }}
{{- $storage := dict "type" $s.type }}
{{- if eq $s.type "local" }}
{{- $_ := set $storage "path" (tpl $s.path .) }}
{{- else }}
{{- $_ := set $storage "bucket" (tpl $s.bucket .) }}
{{- end }}
{{- if $s.prefix }}
{{- $_ := set $storage "prefix" (tpl $s.prefix .) }}
{{- end }}
{{- if eq $s.type "s3" }}
{{- $s3 := dict }}
{{- if $s.s3.region }}{{ $_ := set $s3 "region" (tpl $s.s3.region .) }}{{ end }}
{{- if $s.s3.endpoint }}{{ $_ := set $s3 "endpoint" (tpl $s.s3.endpoint .) }}{{ end }}
{{- if $s.s3.usePathStyle }}{{ $_ := set $s3 "usePathStyle" true }}{{ end }}
{{- if $s3 }}{{ $_ := set $storage "s3" $s3 }}{{ end }}
{{- end }}
{{- if eq $s.type "gcs" }}
{{- $gcs := dict "credentials" (tpl $s.gcs.credentials .) }}
{{- if $s.gcs.endpoint }}{{ $_ := set $gcs "endpoint" (tpl $s.gcs.endpoint .) }}{{ end }}
{{- $_ := set $storage "gcs" $gcs }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gavel.configSecretName" . }}
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
type: Opaque
stringData:
  .gavel.yaml: |
    {{- toYaml (dict "storage" $storage) | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gavel.fullname" . }}
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
{{- $properties := "" }}
{{- range $key, $value := .Values.properties }}
{{- $properties = printf "%s%s=%v\n" $properties $key $value }}
{{- end }}
data:
  gavel.properties: {{ $properties | quote }}
