{{- /*
The server's ServiceAccount, whose projected token authenticates it to substrate's ate-api-server
and whose annotations can bind cloud identities such as IRSA.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gavel.serviceAccountName" . }}
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
