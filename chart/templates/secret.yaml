{{- /*
The server's secrets: the Clerk secret key and GAVEL_SECRET_KEY, generated on first install and
read back from the live Secret on upgrades so run tokens stay valid.
*/ -}}
{{- if .Values.secret.create }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "gavel.secretName" .)) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $secretKey := (get $data "GAVEL_SECRET_KEY" | b64dec) | default (randAlphaNum 48 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gavel.secretName" . }}
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLERK_SECRET_KEY: {{ .Values.clerk.secretKey | quote }}
  GAVEL_SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
