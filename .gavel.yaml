commit:
  allow:
  - .agents/skills/README.md
  - .agents/skills/gavel-runner/SKILL.md
  - testrunner/ui/dist/testui.js
  - .agents/skills/gavel-fixture-tester/**
  - .agents/.claude-plugin/**
  - .claude/skills/**
lint:
  ignore:
  - file: .shell/checkout/8d512cac74b933d1f8d97629ab79966828d2e0789c66a463d8a78e7d40ccc42f/**
  - file: linters/betterleaks/testdata/betterleaks-output.json
    source: betterleaks
  - file: testrunner/ui/dist/testui.js
    rule: '*-*-mention'
    source: betterleaks
  - file: testrunner/ui/pnpm-lock.yaml
    rule: '*-country-short-codes'
    source: betterleaks
  # TODO(https://github.com/flanksource/gavel/issues/150): temporary. These
  # rules are turned off only to get lint passing again after #148 made
  # gavel lint fail on violations. Fixing their ~350 findings
  # now would mean restructuring much of pr/ui, so #149 fixed only the
  # mechanical findings (types, cleanups, keys, labels) and deferred these.
  # Come back to them in smaller PRs and remove each entry once its rule is clean.
  #
  # Structure, style and micro-performance rules: they flag working code and
  # fixing them means restructuring components rather than correcting bugs.
  - rule: react-doctor/only-export-components
  - rule: react-doctor/no-adjust-state-on-prop-change
  - rule: react-doctor/no-high-complexity-react-function
  - rule: react-doctor/no-giant-component
  - rule: react-doctor/no-json-parse-stringify-clone
  - rule: react-doctor/js-set-map-lookups
  - rule: react-doctor/rerender-*
  - rule: react-doctor/prefer-use-effect-event
  - rule: react-doctor/duplicate-jsx-subtree
  # Architecture preferences: they ask to move fetching, state or effects to a
  # different layer, not to correct the behavior of the code they flag.
  - rule: react-doctor/no-fetch-in-effect
  - rule: react-doctor/no-pass-data-to-parent
  - rule: react-doctor/no-pass-live-state-to-parent
  - rule: react-doctor/no-prop-callback-in-effect
  - rule: react-doctor/no-effect-chain
  - rule: react-doctor/no-derived-state
  - rule: react-doctor/no-reset-all-state-on-prop-change
  - rule: react-doctor/async-await-in-loop
  # clicky-ui design-system migration hints (configured as warn in
  # pr/ui/.oxlintrc.json); oxlint and react-doctor both report them.
  - rule: clicky-ui/prefer-clicky-*
pre:
- name: deps
  run: make tidy
ssh:
  cmd: make all
test:
  # The repository's Go and Ginkgo packages run as one go test batch, whose default 10m deadline
  # covers compiling and running all of them; CI's runs reach it.
  testTimeout: 15m
todos:
  triage:
    mode: api
    model: deepseek-flash
    permissions:
      mode: plan
      tools:
        Bash(gavel todos get:*): allow
        Bash(gavel todos list:*): allow
        Bash(gavel pr search:*): allow
        Glob: allow
        Grep: allow
        Read: allow
    prompt:
      schemaStrictness: retry
